<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Minería: Telco Churn Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000000; /* Fondo negro absoluto */
            color: #e2e8f0;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #111319; /* Tarjeta principal en negro profundo */
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a1e29;
        }

        h1 {
            margin-top: 0;
            color: #3182ce;
        }

        p {
            color: #a0aec0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background: #07080a;
            color: #e2e8f0;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            background: #2f855a; /* Botón verde */
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #276749;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            background: #07080a;
            border: 1px solid #2d3748;
        }

        #result h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        #result p {
            margin: 0;
        }

        .neutral {
            color: #a0aec0;
        }

        .error {
            color: #fc8181;
        }

        .success {
            color: #68d391;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Proyecto Minería: Telco Churn Predictor</h1>

    <p>
        Ingrese información del cliente para predecir si es probable que el cliente abandone el servicio de telecomunicaciones.
    </p>

    <form id="predictionForm">

        <label for="tenure">Tenure (months/ meses)</label>
        <input type="number" id="tenure" min="0" required value="12">

        <label for="monthlyCharges">Monthly Charges/ Cargos mensuales</label>
        <input type="number" id="monthlyCharges" min="0" step="0.01" required value="75.50">

        <label for="totalCharges">Total Charges/ Total acumulado</label>
        <input type="number" id="totalCharges" min="0" step="0.01" required value="906.00">

        <label for="contract">Contract/ Contrato</label>
        <select id="contract">
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
        </select>

        <label for="internetService">Internet Service/Servicio de internet</label>
        <select id="internetService">
            <option>DSL</option>
            <option selected>Fiber optic</option>
            <option>No</option>
        </select>

        <button type="submit" id="submitButton">
            Predict Churn
        </button>

    </form>

    <div id="result">
        <h2 id="predictionTitle" class="neutral">Esperando predicción...</h2>
        <p id="predictionDetails">Presiona "Predict Churn" para ver el resultado.</p>
    </div>
</div>

<script>
    const form = document.getElementById("predictionForm");
    const submitButton = document.getElementById("submitButton");
    const predictionTitle = document.getElementById("predictionTitle");
    const predictionDetails = document.getElementById("predictionDetails");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Predicting...";

        predictionTitle.textContent = "Calculando predicción...";
        predictionTitle.className = "neutral";
        predictionDetails.textContent = "Consultando al modelo...";

        const customer = {
            tenure: Number(document.getElementById("tenure").value),
            MonthlyCharges: Number(document.getElementById("monthlyCharges").value),
            TotalCharges: Number(document.getElementById("totalCharges").value),
            Contract: document.getElementById("contract").value,
            InternetService: document.getElementById("internetService").value
        };

        try {
            const response = await fetch("http://127.0.0.1:8000/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(customer)
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();

            predictionTitle.textContent = `Predicted Churn: ${data.churn}`;
            predictionTitle.className = data.prediction === 1 ? "error" : "success";
            predictionDetails.textContent = `Model: ${data.model}`;

        } catch (error) {
            predictionTitle.textContent = "Prediction failed";
            predictionTitle.className = "error";
            predictionDetails.textContent = error.message;

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Predict Churn";
        }
    });
</script>

</body>
</html>
